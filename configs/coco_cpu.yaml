seed: 42
device: cpu
num_classes: 91 # background plus original COCO category-id space
image_size: 640
data:
  train_images: data/coco/images/train2017
  train_annotations: data/coco/annotations/instances_train2017.json
  val_images: data/coco/images/val2017
  val_annotations: data/coco/annotations/instances_val2017.json
model:
  architecture: light_rcnn
  backbone: mobilenet_v3_large
  pretrained: true
  bifpn_channels: 96
  roi_channels: 64 # expanded from 10 to eliminate extreme feature bottleneck
  roi_size: 7
  roi_head_dim: 256 # expanded from 128 to provide sufficient class/box regression capacity
  roi_head_pool_size: 7 # preserve full 7x7 spatial layout without premature pooling
  rpn_anchor_sizes: [[16, 32, 64], [64, 128, 256], [128, 256, 512]] # cover 16px to 512px
  rpn_pre_nms_topk_test: 1000
  rpn_post_nms_topk_test: 300
  box_score_thresh: 0.05
  box_nms_thresh: 0.5
train:
  epochs: 36
  batch_size: 1
  workers: 0
  learning_rate: 0.0002
  weight_decay: 0.0001
  amp: false
  output_dir: outputs/coco_cpu
  validate_every: 1
  val_batch_size: 1
  warmup_steps: 500
  lr_milestones: [24, 32]
  lr_gamma: 0.1
  max_grad_norm: 10.0
  box_batch_size_per_image: 512
  train_limit: 0
  val_limit: 0
  horizontal_flip_prob: 0.5
  subset_selection: seeded_random
distillation:
  enabled: false
  teacher:
    family: faster_rcnn
    architecture: fasterrcnn_resnet50_fpn
    checkpoint: torchvision_coco_v1
  feature_weight: 1.0
  roi_kl_weight: 1.0
  temperature: 2.0
comparison:
  baseline:
    architecture: fasterrcnn_resnet50_fpn
    pretrained_coco: true
    imgsz: 640
    precision: fp32
  light_rcnn:
    architecture: mobile_bifpn_fasterrcnn
    imgsz: 640
    precision: fp32
  control:
    family: yolo26
    variant: yolo26n.pt
    imgsz: 640
    precision: fp32
    weights: yolo26n.pt
  device: cpu
  batch_size: 1
  warmup: 5
  iterations: 30
  image_count: 16
  include_preprocess: true
  include_nms: true
  score_threshold: 0.001 # identical detection score floor for every model's COCO evaluation
  max_detections: 100
  latency_score_threshold: 0.25 # shared deployment-style score floor for latency runs
  targets: # project goals drawn on the dashboard; README targets, not achieved results
    latency_ms: 15
    latency_percentile: p50
    ap_metric: AP_50_95 # confirm with the team whether the 60 target means AP50 instead
    ap: 0.60
export:
  opset: 17
  format: fp16
