<text x="42" y="465" class="note">All models: COCO val2017 5,000 images for AP; 640 input, FP32, batch 1, RTX 4090 latency benchmark (50 warmups, 500 iterations, 64-image cycle).</text>
<text x="42" y="483" class="note">Latency scope includes model transforms and postprocessing, excludes image decode. Framework/evaluation pipelines differ; compare as measured under this project protocol.</text>
